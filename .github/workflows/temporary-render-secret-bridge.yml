# TEMPORARY: delete this workflow immediately after successful use.
# It bridges existing GitHub Secrets into the Render service without logging values.
name: Temporary Render Secret Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-24.04
    env:
      GOOGLE_DRIVE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_CLIENT_JSON }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_PARENT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_PARENT_FOLDER_ID }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Bridge secrets to Render
        shell: bash
        run: |
          set -euo pipefail

          api_base='https://api.render.com/v1'
          service_name='sarguardian-backend'
          response_file="$(mktemp)"
          request_file="$(mktemp)"
          trap 'rm -f "$response_file" "$request_file"' EXIT

          if [[ -z "$RENDER_API_KEY" ]]; then
            echo 'RENDER_API_KEY is not configured' >&2
            exit 1
          fi

          service_http_status="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Accept: application/json' \
            "$api_base/services?name=$service_name")"
          if [[ "$service_http_status" != 2* ]]; then
            echo 'Render service lookup failed' >&2
            exit 1
          fi

          service_id="$(jq -r '
            [ .[] | (.service // .) | select(.name == "sarguardian-backend") | .id ] | unique | if length == 1 then .[0] else empty end
          ' "$response_file")"
          if [[ -z "$service_id" ]]; then
            echo 'Render service was not uniquely identified' >&2
            exit 1
          fi
          echo 'SERVICE_FOUND=true'

          update_env_var() {
            local key="$1"
            local value="$2"
            jq -n --arg value "$value" '{value: $value}' > "$request_file"
            local status
            status="$(curl -sS -o "$response_file" -w '%{http_code}' \
              -X PUT \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              --data-binary "@$request_file" \
              "$api_base/services/$service_id/env-vars/$key")"
            if [[ "$status" != 2* ]]; then
              echo "Render environment update failed for $key" >&2
              exit 1
            fi
          }

          update_env_var 'GOOGLE_DRIVE_OAUTH_CLIENT_JSON' "$GOOGLE_DRIVE_OAUTH_CLIENT_JSON"
          echo 'DRIVE_CLIENT_JSON_SET=true'

          update_env_var 'GOOGLE_DRIVE_REFRESH_TOKEN' "$GOOGLE_DRIVE_REFRESH_TOKEN"
          echo 'DRIVE_REFRESH_TOKEN_SET=true'

          update_env_var 'GOOGLE_DRIVE_PARENT_FOLDER_ID' "$GOOGLE_DRIVE_PARENT_FOLDER_ID"
          echo 'DRIVE_PARENT_FOLDER_SET=true'

          update_env_var 'DRIVE_MODE' 'real'
          echo 'DRIVE_MODE_SET=true'

          deploy_status="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Accept: application/json' \
            "$api_base/services/$service_id/deploys")"
          if [[ "$deploy_status" != 2* ]]; then
            echo 'Render deploy trigger failed' >&2
            exit 1
          fi
          echo 'DEPLOY_TRIGGERED=true'
