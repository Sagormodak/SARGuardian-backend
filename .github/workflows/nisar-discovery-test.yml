name: NISAR Discovery Test

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04

    steps:
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install latest earthaccess
        run: python -m pip install --upgrade earthaccess

      - name: Authenticate and search for NISAR GCOV
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          python - <<'PY'
          import sys

          try:
              import earthaccess

              auth = earthaccess.login(strategy="environment")
              results = earthaccess.search_data(
                  short_name="NISAR_L2_GCOV_PROVISIONAL_V1",
                  count=1,
              )
          except Exception:
              print("NISAR_DISCOVERY_FAILED")
              sys.exit(1)

          if results:
              print("NISAR_DISCOVERY_SUCCESS")
          else:
              print("NISAR_DISCOVERY_NO_RESULTS")
          PY