name: SARGuardian Science Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job ID"
        required: true
        type: string
      benchmark_only:
        description: "Run benchmark mode (single product)"
        required: false
        default: false
        type: boolean
      target_lat:
        description: "Target latitude"
        required: false
        default: "28.27799"
        type: string
      target_lon:
        description: "Target longitude"
        required: false
        default: "85.52983"
        type: string
      start_date:
        description: "Temporal start date (YYYY-MM-DD)"
        required: false
        default: "2025-11-25"
        type: string

jobs:
  sarguardian-science:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      GOOGLE_DRIVE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_CLIENT_JSON }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_PARENT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_PARENT_FOLDER_ID }}
      WORKER_CALLBACK_SECRET: ${{ secrets.WORKER_CALLBACK_SECRET }}
      RENDER_CALLBACK_URL: ${{ vars.RENDER_CALLBACK_URL }}

    steps:
      - name: Checkout SARGuardian backend
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify backend revision
        shell: bash
        run: git rev-parse HEAD

      - name: Checkout pinned SARGuardian science source
        uses: actions/checkout@v4
        with:
          repository: Sagormodak/SARGuardian
          ref: 77cc9646cfa46d3aff3669d351912f984cf67aa3
          path: science-source

      - name: Verify science source revision
        shell: bash
        run: |
          expected="77cc9646cfa46d3aff3669d351912f984cf67aa3"
          actual="$(git -C science-source rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pinned science requirements and Earthaccess
        run: |
          python -m pip install --no-cache-dir --requirement science-source/requirements.txt
          python -m pip install --no-cache-dir --upgrade earthaccess

      - name: Run SARGuardian GOFF worker
        id: worker
        env:
          JOB_ID: ${{ inputs.job_id }}
          BENCHMARK_ONLY: ${{ inputs.benchmark_only }}
          TARGET_LAT: ${{ inputs.target_lat }}
          TARGET_LON: ${{ inputs.target_lon }}
          START_DATE: ${{ inputs.start_date }}
        shell: bash
        run: |
          set -euo pipefail
          PARAMETERS_JSON="$(
          python - <<'PY'
          import json
          import os

          parameters = {
              "target_lat": os.environ["TARGET_LAT"],
              "target_lon": os.environ["TARGET_LON"],
              "start_date": os.environ["START_DATE"],
          }
          print(json.dumps(parameters, separators=(",", ":")))
          PY
          )"

          printf 'WORKER_PARAMETERS_JSON: %s\n' "$PARAMETERS_JSON"

          worker_args=(
            --job-id "$JOB_ID"
            --output-dir "$PWD/result"
            --science-root "$PWD/science-source"
            --parameters "$PARAMETERS_JSON"
          )

          if [ "$BENCHMARK_ONLY" = "true" ]; then
            worker_args+=(--benchmark-only)
          fi

          python scripts/sarguardian_worker.py "${worker_args[@]}"
          pwd
          ls -lah result/
          test -f result/result.json
          test -f result/timeseries.csv
          test -f result/manifest.json
          test -f result/README.txt

      - name: Complete worker-generated result package
        if: success()
        shell: bash
        run: |
          test -f result/manifest.json
          cat > result/README.txt <<'EOF'
          SARGuardian GOFF time-series result

          This package contains the compact result of sequential GOFF processing.
          Science commit: 77cc9646cfa46d3aff3669d351912f984cf67aa3
          Job ID: ${{ inputs.job_id }}
          Mode: ${{ inputs.benchmark_only && 'benchmark' || 'full' }}
          Workflow: sequential Earthaccess GOFF downloads, pinned read_goff layer2 processing,
          source-AOI fixed-lattice common reference, candidate-4 target-window measurement,
          and existing time-series inversion.
          result.json contains the compact run summary.
          timeseries.csv contains cumulative time-series rows.
          manifest.json records provenance, selections, measurements, inversions, timings, and cleanup status.
          Raw NISAR HDF5 products are deleted immediately after derived processing and are not included in this package.
          EOF

      - name: Upload GOFF result package to Google Drive
        if: success()
        id: drive_upload
        env:
          GOOGLE_DRIVE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_CLIENT_JSON }}
          GOOGLE_DRIVE_PARENT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_PARENT_FOLDER_ID }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          output=$(python scripts/upload_goff_result_to_drive.py)
          echo "$output"
          folder_id=$(printf '%s\n' "$output" | sed -n 's/^DRIVE_FOLDER_ID: //p' | tail -n 1)
          file_ids_json=$(printf '%s\n' "$output" | sed -n 's/^DRIVE_FILE_IDS_JSON: //p' | tail -n 1)
          test -n "$folder_id"
          printf '%s' "$file_ids_json" | jq -e -c '
            type == "object"
            and (keys | sort == ["README.txt", "manifest.json", "result.json", "timeseries.csv"])
            and all(.[]; type == "string" and length > 0)
          ' > /dev/null
          echo "drive_folder_id=$folder_id" >> "$GITHUB_OUTPUT"
          echo "drive_file_ids=$(printf '%s' "$file_ids_json" | jq -c .)" >> "$GITHUB_OUTPUT"

      - name: Callback Render with completion
        if: always()
        shell: bash
        run: |
          if [ -n "${RENDER_CALLBACK_URL}" ] && [ -n "${WORKER_CALLBACK_SECRET}" ]; then
            STATUS="completed"
            if [ "${{ job.status }}" != "success" ]; then
              STATUS="failed"
            fi
            if [ "$STATUS" = "completed" ]; then
              PAYLOAD=$(jq -cn \
                --arg job_id "${{ inputs.job_id }}" \
                --arg run_id "${{ github.run_id }}" \
                --arg result_folder_id "${{ steps.drive_upload.outputs.drive_folder_id }}" \
                --argjson result_file_ids '${{ steps.drive_upload.outputs.drive_file_ids }}' \
                '{job_id: $job_id, status: "completed", run_id: $run_id, result_folder_id: $result_folder_id, result_file_ids: $result_file_ids}')
            else
              PAYLOAD=$(jq -cn \
                --arg job_id "${{ inputs.job_id }}" \
                --arg run_id "${{ github.run_id }}" \
                '{job_id: $job_id, status: "failed", run_id: $run_id}')
            fi
            curl -X POST "${RENDER_CALLBACK_URL}/worker/callback/${{ inputs.job_id }}" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${WORKER_CALLBACK_SECRET}" \
              -d "$PAYLOAD" \
              --max-time 30 --retry 3 --retry-delay 5 || echo "Callback failed but continuing"
          else
            echo "Callback not configured, skipping"
          fi

      - name: Upload result package as artifact (fallback)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sarguardian-goff-result-${{ github.run_id }}
          path: result/
          if-no-files-found: error
