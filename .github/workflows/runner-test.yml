name: Runner Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04

    steps:
      - name: Show system information
        run: |
          echo "=== CPU ==="
          nproc
          lscpu | grep -E '^CPU\(s\):|^Model name:'

          echo "=== RAM ==="
          free -h

          echo "=== DISK BEFORE ==="
          df -h /

      - name: Disk write benchmark
        run: |
          echo "=== WRITING 5 GB TEST FILE ==="
          time fallocate -l 5G /tmp/test-5gb.bin

          echo "=== DISK AFTER WRITE ==="
          df -h /

      - name: Disk read benchmark
        run: |
          echo "=== READING 5 GB TEST FILE ==="
          time dd if=/tmp/test-5gb.bin of=/dev/null bs=64M status=progress

      - name: Memory stress test
        run: |
          python - <<'PY'
          import time

          print("Allocating approximately 4 GB RAM...")

          data = bytearray(4 * 1024 * 1024 * 1024)

          print("4 GB allocation successful.")
          print("Sleeping for 10 seconds...")
          time.sleep(10)

          del data

          print("Memory released successfully.")
          PY

      - name: Disk after benchmark
        run: |
          echo "=== DISK AFTER ==="
          df -h /

      - name: Cleanup
        run: |
          rm -f /tmp/test-5gb.bin

          echo "=== DISK AFTER CLEANUP ==="
          df -h /