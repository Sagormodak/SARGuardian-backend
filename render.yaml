services:
  - type: web
    name: sarguardian-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET_KEY
        sync: false
      - key: SCIENCE_MODE
        value: github_actions
      - key: DRIVE_MODE
        value: real
      - key: GITHUB_WORKFLOW_REF
        value: main
      - key: WORKER_CALLBACK_SECRET
        sync: false
